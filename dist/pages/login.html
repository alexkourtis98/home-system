<!doctype html>
<html lang="en" data-pc-preset="preset-1" data-pc-sidebar-caption="true" data-pc-direction="ltr" dir="ltr" data-pc-theme="light">
  <!-- [Head] start -->
  <head>
    <title>Login - HomeSystem | HomeSystem</title>
    <!-- [Meta] -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimal-ui" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="description"
      content="HomeSystem is Property Management Application for landlords and property managers."
    />
    <meta
      name="keywords"
      content="Bootstrap admin template, Dashboard UI Kit, Dashboard Template, Backend Panel, react dashboard, angular dashboard"
    />
    <meta name="author" content="HomeSystem Team" />

    <!-- [Favicon] icon -->
    <link rel="icon" href="../assets/images/favicon.svg" type="image/x-icon" />
 
     <!-- [Font] Family -->
     <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <!-- [phosphor Icons] https://phosphoricons.com/ -->
    <link rel="stylesheet" href="../assets/fonts/phosphor/duotone/style.css" />
    <!-- [Tabler Icons] https://tablericons.com -->
    <link rel="stylesheet" href="../assets/fonts/tabler-icons.min.css" />
    <!-- [Feather Icons] https://feathericons.com -->
    <link rel="stylesheet" href="../assets/fonts/feather.css" />
    <!-- [Font Awesome Icons] https://fontawesome.com/icons -->
    <link rel="stylesheet" href="../assets/fonts/fontawesome.css" />
    <!-- [Material Icons] https://fonts.google.com/icons -->
    <link rel="stylesheet" href="../assets/fonts/material.css" />
    <!-- [Template CSS Files] -->
    <link rel="stylesheet" href="../assets/css/style.css" id="main-style-link" />
    <!-- [Modal Fix CSS] -->
    <link rel="stylesheet" href="../assets/css/modal-fix.css" />

  </head>
  <!-- [Head] end -->
  <!-- [Body] Start -->

  <body>
    <!-- [ Pre-loader ] start -->
    <div class="loader-bg fixed inset-0 bg-white dark:bg-themedark-cardbg z-[1034]">
      <div class="loader-track h-[5px] w-full inline-block absolute overflow-hidden top-0">
        <div class="loader-fill w-[300px] h-[5px] bg-primary-500 absolute top-0 left-0 animate-[hitZak_0.6s_ease-in-out_infinite_alternate]"></div>
      </div>
    </div>
    <!-- [ Pre-loader ] End -->

    <div class="auth-main relative">
      <div class="auth-wrapper v1 flex items-center w-full h-full min-h-screen">
        <div class="auth-form flex items-center justify-center grow flex-col min-h-screen relative p-6">
          <div class="w-full max-w-[400px] relative">
            <div class="auth-bg">
              <span class="absolute top-[-100px] right-[-100px] w-[300px] h-[300px] block rounded-full bg-theme-bg-1 animate-[floating_7s_infinite]"></span>
              <span class="absolute top-[150px] right-[-150px] w-5 h-5 block rounded-full bg-primary-500 animate-[floating_9s_infinite]"></span>
              <span class="absolute left-[-150px] bottom-[150px] w-5 h-5 block rounded-full bg-theme-bg-1 animate-[floating_7s_infinite]"></span>
              <span class="absolute left-[-100px] bottom-[-100px] w-[300px] h-[300px] block rounded-full bg-theme-bg-2 animate-[floating_9s_infinite]"></span>
            </div>
            <div class="card sm:my-12 w-full shadow-xl">
              <div class="card-body !p-10">
                <div class="text-center mb-8">
                  <h2 class="text-2xl font-bold text-gray-800 dark:text-white mb-2">🏠 HomeSystem</h2>
                  <p class="text-gray-600 dark:text-gray-400">Property Management System</p>
                </div>
                
                <div id="loginAlert" class="hidden alert alert-danger mb-4"></div>
                
                <form id="loginForm">
                  <div class="mb-4">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required />
                  </div>
                  <div class="mb-4">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required />
                  </div>
                  <div class="flex mt-1 justify-between items-center flex-wrap mb-4">
                    <div class="form-check">
                      <input class="form-check-input input-primary" type="checkbox" id="rememberMe" />
                      <label class="form-check-label text-muted" for="rememberMe">Remember me</label>
                    </div>
                  </div>
                  <div class="mt-6 text-center">
                    <button type="submit" id="loginBtn" class="btn btn-primary w-full shadow-lg">
                      <span class="btn-text">Sign In</span>
                      <span class="btn-loading hidden">
                        <i class="ti ti-loader animate-spin mr-2"></i>
                        Signing in...
                      </span>
                    </button>
                  </div>
                </form>
                
                <div class="mt-6 p-4 bg-gray-50 dark:bg-gray-800 rounded-lg">
                  <h6 class="text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Demo Credentials:</h6>
                  <p class="text-sm text-gray-600 dark:text-gray-400">
                    <strong>Username:</strong> admin<br>
                    <strong>Password:</strong> admin123
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- [ Main Content ] end -->
    <!-- Required Js -->
    <script src="../assets/js/plugins/simplebar.min.js"></script>
    <script src="../assets/js/plugins/popper.min.js"></script>
    <script src="../assets/js/icon/custom-icon.js"></script>
    <script src="../assets/js/plugins/feather.min.js"></script>
    <script src="../assets/js/component.js"></script>
    <script src="../assets/js/theme.js"></script>
    <script src="../assets/js/script.js"></script>

    <div class="floting-button fixed bottom-[50px] right-[30px] z-[1030]">
    </div>

    
    <script>
      layout_change('false');
    </script>
     
    
    <script>
      layout_theme_sidebar_change('dark');
    </script>
    
     
    <script>
      change_box_container('false');
    </script>
     
    <script>
      layout_caption_change('true');
    </script>
     
    <script>
      layout_rtl_change('false');
    </script>
     
    <script>
      preset_change('preset-1');
    </script>
     
    <script>
      main_layout_change('vertical');
    </script>
    
 
    
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const loginAlert = document.getElementById('loginAlert');
        const btnText = loginBtn.querySelector('.btn-text');
        const btnLoading = loginBtn.querySelector('.btn-loading');
        
        // Check if already logged in
        const token = localStorage.getItem('token');
        if (token) {
          window.location.href = '../dashboard/index.html';
          return;
        }
        
        loginForm.addEventListener('submit', async function(e) {
          e.preventDefault();
          
          const username = document.getElementById('username').value;
          const password = document.getElementById('password').value;
          
          // Show loading state
          btnText.classList.add('hidden');
          btnLoading.classList.remove('hidden');
          loginBtn.disabled = true;
          loginAlert.classList.add('hidden');
          
          try {
            const response = await fetch('http://localhost:5000/api/auth/login', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ username, password })
            });
            
            const data = await response.json();
            
            if (data.success) {
              // Store token
              localStorage.setItem('token', data.token);
              localStorage.setItem('user', JSON.stringify(data.user));
              
              // Redirect to dashboard
              window.location.href = '../dashboard/index.html';
            } else {
              // Show error
              loginAlert.textContent = data.message || 'Invalid credentials';
              loginAlert.classList.remove('hidden');
            }
          } catch (error) {
            console.error('Login error:', error);
            loginAlert.textContent = 'Connection error. Please try again.';
            loginAlert.classList.remove('hidden');
          } finally {
            // Reset button state
            btnText.classList.remove('hidden');
            btnLoading.classList.add('hidden');
            loginBtn.disabled = false;
          }
        });
      });
    </script>
  </body>
  <!-- [Body] end -->
</html>
