services:
  # Home System Application
  app:
    build: .
    container_name: home-system-app
    ports:
      - "43217:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/home-system
      - JWT_SECRET=${JWT_SECRET:-home-system-secret-key-change-in-production}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@home-system.com}
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=1000
    depends_on:
      - mongodb
    networks:
      - home-system-network
    restart: unless-stopped

  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: home-system-mongodb
    ports:
      - "43218:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - home-system-network
    restart: unless-stopped

networks:
  home-system-network:
    driver: bridge

volumes:
  mongodb-data:
    driver: local
